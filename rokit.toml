# Ferramentas do projeto, com versoes fixadas.
#
# NOTA: o `rokit install` nao funciona nesta maquina porque o Norton 360 faz
# inspecao de HTTPS e o Rokit (Rust/rustls) rejeita o certificado injetado.
# Usar `scripts/instalar-ferramentas.ps1`, que descarrega estas mesmas versoes
# via PowerShell para .\tools\. Ver o comentario no topo desse script.
#
# Este ficheiro continua a ser a fonte de verdade das versoes.

[tools]
rojo = "rojo-rbx/rojo@7.7.1"
lune = "lune-org/lune@0.11.0"
stylua = "JohnnyMorganz/StyLua@2.6.0"
selene = "Kampfkarren/selene@0.32.0"
# Verificacao de tipos com a API real da Roblox. Apanha o que o selene nao
# apanha, como atribuir um Enum.NormalId onde se espera um Enum.SurfaceType.
luau-lsp = "JohnnyMorganz/luau-lsp@1.70.1"
