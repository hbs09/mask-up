name: Verificar

# As mesmas verificacoes que o scripts/verificar.ps1 corre localmente, mas em
# cada push e pull request. Com TDD isto vale muito: apanha o que se partiu sem
# dependeres de te lembrares de correr o script antes de fazer commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    # Fixado em vez de `ubuntu-latest` de proposito: o `ubuntu-latest` migra para
    # o Ubuntu 26 a 19 de outubro de 2026, e nao ha vantagem em descobrir isso
    # atraves de um CI vermelho num dia em que estejamos a mexer noutra coisa.
    # Subir isto e uma linha, e deve ser um commit proprio.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Aqui o Rokit funciona normalmente: o problema de certificados que obriga
      # a usar scripts/instalar-ferramentas.ps1 na maquina local e causado pelo
      # Norton 360 a interceptar HTTPS, e nao existe no Linux do CI.
      #
      # Instalamos pelo script oficial em vez de uma action de terceiros para
      # nao acrescentar uma dependencia que teria de ser auditada e mantida.
      - name: Instalar o Rokit
        run: |
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      # O `rokit install` recusa-se a instalar ferramentas que nao estejam
      # marcadas como confiaveis, e o prompt interativo nao funciona no CI.
      # O --no-trust-check existe para este caso ("recommended to only use this
      # on CI machines", diz a ajuda do proprio rokit).
      - name: Instalar as ferramentas do rokit.toml
        run: rokit install --no-trust-check

      - name: Versoes
        run: |
          rojo --version
          lune --version
          stylua --version
          selene --version || true   # o `selene --version` sai com codigo -1 mesmo quando funciona

      - name: Formatacao (stylua)
        run: stylua --check src tests .lune

      # Sem os globais do Roblox, de proposito: isto garante que o core puro
      # continua puro e portanto testavel fora do Studio. Ver selene.toml.
      - name: Lint do core puro
        run: selene src/Server/Core tests .lune

      - name: Lint dos adaptadores Roblox
        run: selene --config selene-roblox.toml src/Shared src/Server/Services src/Server/Main.server.luau src/Client

      # Apanha erros de tipos da API do Roblox, que o selene nao ve: o
      # roblox-minimo.toml declara os globais com `any = true`, logo confirma que
      # `Enum` existe mas nao valida os membros. Foi assim que um
      # `TopSurface = Enum.NormalId.Top` nos custou uma ida ao Studio.
      - name: Definicoes de tipos do Roblox
        run: curl -fsSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau

      - name: Verificacao de tipos
        run: |
          rojo sourcemap default.project.json --output sourcemap.json
          luau-lsp analyze \
            --sourcemap=sourcemap.json \
            --definitions=globalTypes.d.luau \
            --base-luaurc=.luaurc \
            --platform=roblox \
            src

      # Antes de confiar nos testes, confirmar que o harness deteta falhas.
      - name: Auto-teste do harness
        run: lune run .lune/autoteste-harness.luau

      - name: Testes
        run: lune run .lune/tests.luau

      # Confere a aritmetica do mapa: nada a flutuar no vazio, percurso continuo
      # do lobby ate a carrinha. Existe porque o lobby e a loja ja estiveram em
      # plataformas separadas, com 50 studs de queda mortal entre as duas.
      - name: Geometria do mapa
        run: lune run tests/_geometria.luau

      # Falha se o default.project.json referir ficheiros que nao existem, ou se
      # a arvore nao puder ser construida.
      - name: Construir a place
        run: rojo build --output mask-up.rbxlx

      # Permite descarregar a place construida para abrir no Studio, util para
      # confirmar um PR sem ter o projeto montado localmente.
      - name: Guardar a place como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: place-mask-up
          path: mask-up.rbxlx
          retention-days: 14
